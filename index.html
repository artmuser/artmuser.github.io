<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>artmuser</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header class="topbar">
        <div class="brand">MagnetShare</div>
        <nav class="nav">
            <a href="index.html" class="active">首页</a>
            <a href="detail.html">详情</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>快速分享磁力链接</h1>
            <p class="sub">粘贴磁力链接，生成简洁分享卡片，方便复制和查看。</p>
        </section>

        <section class="card share-card">
            <label for="magnetInput">磁力链接</label>
            <textarea id="magnetInput" placeholder="magnet:?xt=urn:btih:..." rows="3"></textarea>

            <div class="row">
                <input type="text" id="titleInput" placeholder="标题（可选）" />
            </div>

            <div class="actions">
                <button id="previewBtn" class="btn secondary">预览</button>
                <button id="shareBtn" class="btn primary">复制分享</button>
            </div>

            <p id="shareTip" class="tip"></p>
        </section>

        <section class="card">
            <div class="section-header">
                <h2>最近分享</h2>
                <span class="count" id="recentCount">0</span>
            </div>

            <ul id="recentList" class="recent-list"></ul>

            <div id="emptyState" class="empty">
                还没有分享内容，先粘贴一个磁力链接试试。
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>仅供学习交流，请勿分享或传播违法内容。</p>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
