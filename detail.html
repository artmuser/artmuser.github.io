<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>artmuser</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header class="topbar">
        <div class="brand">MagnetShare</div>
        <nav class="nav">
            <a href="index.html">首页</a>
            <a href="detail.html" class="active">详情</a>
        </nav>
    </header>

    <main class="container">
        <section class="card" id="detailCard">
            <div id="detailContent" style="display:none;">
                <div class="section-header">
                    <h2 id="detailTitle">未命名磁力链接</h2>
                </div>

                <div class="meta-row">
                    <span id="detailTime" class="meta"></span>
                </div>

                <label>磁力链接</label>
                <div class="magnet-box">
                    <code id="detailMagnet"></code>
                </div>

                <div class="actions">
                    <button id="copyBtn" class="btn primary">复制磁力链接</button>
                    <button id="openBtn" class="btn secondary">打开链接</button>
                </div>

                <p id="detailTip" class="tip"></p>

                <div class="qr-section">
                    <div class="section-header">
                        <h2>二维码</h2>
                    </div>
                    <div id="qrBox" class="qr-box"></div>
                    <p class="qr-tip">可将磁力链接生成二维码，方便扫码查看。</p>
                </div>
            </div>

            <div id="emptyDetail" class="empty">
                没有找到分享内容，请返回首页重新分享。
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>仅供学习交流，请勿分享或传播违法内容。</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/detail.js"></script>
</body>

</html>
